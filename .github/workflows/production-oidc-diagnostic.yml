name: Production OIDC Diagnostic

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    name: Diagnose Production OIDC
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Inspect production OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(
                token.split('.')[1],
                'base64url'
              ).toString()
            );

            core.info(`OIDC sub: ${payload.sub}`);
            core.info(`OIDC aud: ${payload.aud}`);
            core.info(`OIDC repository: ${payload.repository}`);
            core.info(`OIDC ref: ${payload.ref}`);
            core.info(`OIDC environment: ${payload.environment || 'none'}`);